<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf6" />
    <title>LOOM — Made close to home</title>
    <meta name="description" content="LOOM connects you with trusted home cooks, bakers, tiffin providers and caterers in Coimbatore — browse verified kitchens, order meals made close to home, and schedule deliveries around your week." />
    <link rel="canonical" href="https://loom.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOOM" />
    <meta property="og:title" content="LOOM — Made close to home" />
    <meta property="og:description" content="Discover trusted home cooks, bakers, tiffin providers and caterers near you in Coimbatore." />
    <meta property="og:image" content="https://loom.app/assets/og-image.png" />
    <meta property="og:url" content="https://loom.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LOOM — Made close to home" />
    <meta name="twitter:description" content="Discover trusted home cooks, bakers, tiffin providers and caterers near you in Coimbatore." />
    <meta name="twitter:image" content="https://loom.app/assets/og-image.png" />

    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./assets/icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="location-button" id="location-button" aria-label="Change delivery area">
          <span class="pin">⌖</span>
          <span><small>Delivering to</small><strong id="delivery-address">RS Puram, Coimbatore</strong></span>
          <span class="chevron">⌄</span>
        </button>
        <button class="profile-button" id="profile-button" aria-label="Open profile">A</button>
      </header>

      <main id="app-content"></main>

      <button class="assistant-button" id="assistant-button" aria-label="Ask Loom assistant"><span>✦</span></button>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span>⌂</span><small>Home</small></button>
        <button class="nav-item" data-view="explore"><span>⌕</span><small>Explore</small></button>
        <button class="nav-item cart-nav" data-view="cart"><span>♧</span><small>Basket</small><b id="cart-count">0</b></button>
        <button class="nav-item" data-view="orders"><span>▣</span><small>Orders</small></button>
        <button class="nav-item" data-view="profile"><span>◡</span><small>You</small></button>
      </nav>
    </div>

    <div class="modal-layer" id="modal-layer" aria-live="polite"></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="./app.js?v=5"></script>
  </body>
</html>
