databases:
  - name: loom-user-db
    databaseName: loom_user
    plan: free
    region: singapore

  - name: loom-admin-db
    databaseName: loom_admin
    plan: free
    region: singapore

services:
  - type: web
    name: loom-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    # No preDeployCommand — it's a paid-plan-only Blueprint field (confirmed
    # against Render's docs), unavailable on the free plan used here.
    # Migrations run automatically at app boot instead (see main.ts).
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: USER_DATABASE_URL
        fromDatabase:
          name: loom-user-db
          property: connectionString
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: loom-admin-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PAYOUT_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # Optional — AI assistant (Google Gemini). Leave unset to keep the
      # assistant chat replying with a static "not available" fallback
      # message (safe default, nothing breaks) — see AssistantModal/
      # backend/src/assistant.
      - key: GEMINI_API_KEY
        sync: false
      # Optional — Shell access (needed to run scripts/seed-admin.ts
      # manually) is also paid-only on Render, so set these to have the app
      # seed/update one admin account at boot instead. Leave both unset
      # after the account exists; safe to leave set too (idempotent upsert).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
