databases:
  - name: loom-user-db
    databaseName: loom_user
    plan: free
    region: singapore

  - name: loom-admin-db
    databaseName: loom_admin
    plan: free
    region: singapore

services:
  - type: web
    name: loom-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    preDeployCommand: npm run migration:run
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: USER_DATABASE_URL
        fromDatabase:
          name: loom-user-db
          property: connectionString
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: loom-admin-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PAYOUT_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
